name: Publish to Nexus Mods

on:
  release:
    types: [published]

jobs:
  upload-to-nexus:
    runs-on: ubuntu-latest

    steps:
      - name: Download release asset
        id: download
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: '*.zip'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version and filename
        run: |
          # Strip the 'v' prefix from tag name for version
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # Remove leading 'v' if present

          # Store version for later step
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_MODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MODS_MOD_ID }}
          file_id: ${{ vars.NEXUS_MODS_FILE_GROUP }}
          filename: mc2hook
          display_name: mc2hook
          version: ${{ env.VERSION }}
          changelog: ${{ github.event.release.body }}
          update_mod_version: true
          archive_existing_version: true
          primary_mod_manager_download: true
